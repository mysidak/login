<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIDAK - Sistem Informasi Data Konstituen</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  .hdr{background:linear-gradient(110deg,#0a2463 0%,#1d4ed8 55%,#60a5fa 100%)}
  .inp{width:100%;border:1px solid #cbd5e1;border-radius:.6rem;padding:.6rem .8rem;outline:none;background:#fff}
  .inp:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px #1d4ed833}
  .btn{background:#15803d;color:#fff;font-weight:700;border-radius:.6rem;padding:.65rem 1rem}
  .btn:hover{background:#166534} .btn:disabled{opacity:.6}
  .btn-b{background:#1d4ed8} .btn-b:hover{background:#1e40af}
  .tbl-wrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:.75rem}
  .tbl{width:100%;font-size:.875rem;border-collapse:separate;border-spacing:0}
  .tbl th{background:#f1f5f9;color:#475569;font-weight:700;text-align:left;padding:.7rem 1rem;white-space:nowrap;border-bottom:1px solid #e2e8f0}
  .tbl td{padding:.75rem 1rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl tbody tr:hover td{background:#f8fafc}
  .ba{display:inline-block;padding:.35rem .8rem;border-radius:.5rem;font-size:.75rem;font-weight:700;color:#fff;white-space:nowrap}
  .ba+.ba{margin-left:.4rem}
  .ba-g{background:#16a34a}.ba-g:hover{background:#15803d}
  .ba-y{background:#facc15;color:#422006}.ba-y:hover{background:#eab308}
  .ba-r{background:#dc2626}.ba-r:hover{background:#b91c1c}
  .ba-o{background:#f97316}.ba-o:hover{background:#ea580c}
  .ba-b{background:#1d4ed8}.ba-b:hover{background:#1e40af}
  .abstrak{background-color:#eceff3;background-image:
    radial-gradient(circle at 10% 16%,#dde2e9 0 13%,transparent 13.4%),
    radial-gradient(circle at 90% 10%,#e2e6ec 0 9%,transparent 9.4%),
    radial-gradient(circle at 84% 86%,#d8dde5 0 19%,transparent 19.4%),
    radial-gradient(circle at 6% 90%,#e0e4ea 0 8%,transparent 8.4%),
    radial-gradient(circle at 50% 50%,transparent 0 30%,#0000000a 30.2% 30.8%,transparent 31%),
    repeating-linear-gradient(135deg,transparent 0 26px,#0000000a 26px 27px),
    linear-gradient(135deg,#f4f6f9,#e5e8ed)}
  .tbl-t th{position:sticky;left:0;z-index:1;min-width:6.5rem;border-right:1px solid #e2e8f0}
  .tbl-t td{min-width:11rem;vertical-align:top;border-right:1px solid #f1f5f9}
  .tbl-t tbody tr:hover td{background:transparent}
  .tbl-t .ba{display:block;text-align:center}
  .tbl-t .ba+.ba{margin-left:0}
  .nav-btn{width:2.25rem;height:2.25rem;border-radius:.5rem;border:1px solid #cbd5e1;background:#fff;color:#334155}
  .nav-btn:hover:not(:disabled){background:#f1f5f9}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- A. SPLASH -->
<div id="splash" class="fixed inset-0 z-50 abstrak transition-transform duration-700 ease-in-out">
  <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
<img class="js-logo w-[11.25rem] h-[11.25rem] object-contain" alt="https://res.cloudinary.com/q7sznixw/image/upload/v1791355406/Logo_SIDAK_Data_Konstituen_i9hub5.webp">
  </div>

</div>

<!-- B. LOGIN -->
<section id="v-login" class="hidden min-h-screen flex flex-col p-4 abstrak">
  <div class="flex-1 flex items-center justify-center w-full">
  <div class="w-full max-w-sm bg-white/90 backdrop-blur rounded-2xl shadow-xl p-6">
    <img class="js-logo mx-auto mb-5 w-56 max-w-full max-h-56 object-contain" alt="https://res.cloudinary.com/q7sznixw/image/upload/v1791355406/Logo_SIDAK_Data_Konstituen_i9hub5.webp">
    <label class="text-sm font-semibold">Masuk sebagai</label>
    <div class="grid grid-cols-2 gap-2 mb-3" role="radiogroup" aria-label="Masuk sebagai"><label class="cursor-pointer"><input type="radio" name="role" value="admin" class="peer sr-only" onchange="setRole()"><span class="flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white py-2.5 font-semibold text-slate-600 hover:bg-slate-50 peer-checked:border-green-700 peer-checked:bg-green-700 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-green-600"><i class="fa-solid fa-user-shield"></i>Admin</span></label><label class="cursor-pointer"><input type="radio" name="role" value="user" class="peer sr-only" onchange="setRole()"><span class="flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white py-2.5 font-semibold text-slate-600 hover:bg-slate-50 peer-checked:border-green-700 peer-checked:bg-green-700 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-green-600"><i class="fa-solid fa-user"></i>User</span></label></div>
    <div id="blk-admin" class="hidden mb-3"><label class="text-sm font-semibold">Password</label>
      <div class="relative mb-0"><input id="pAdmin" type="password" class="inp pr-11" autocomplete="current-password"><button type="button" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-slate-800" onclick="toggleEye('pAdmin',this)" aria-label="Lihat password"><i class="fa-regular fa-eye"></i></button></div></div>
    <div id="blk-hp" class="hidden mb-3"><label class="text-sm font-semibold">Nomor Telepon</label>
      <input id="hp" type="tel" inputmode="tel" class="inp" placeholder="08xxxxxxxxxx"></div>
    <div id="blk-pass" class="hidden mb-3"><label class="text-sm font-semibold">Password</label>
      <div class="relative mb-0"><input id="pUser" type="password" class="inp pr-11" autocomplete="current-password"><button type="button" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-slate-800" onclick="toggleEye('pUser',this)" aria-label="Lihat password"><i class="fa-regular fa-eye"></i></button></div></div>
    <div id="blk-reg" class="hidden mb-3">
      <p class="text-sm text-slate-600 mb-2">Nomor Anda terdaftar. Buat password untuk akun ini (min. 6 karakter).</p>
      <div class="relative mb-2"><input id="pReg1" type="password" class="inp pr-11" autocomplete="new-password" placeholder="Password baru"><button type="button" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-slate-800" onclick="toggleEye('pReg1',this)" aria-label="Lihat password"><i class="fa-regular fa-eye"></i></button></div>
      <div class="relative mb-0"><input id="pReg2" type="password" class="inp pr-11" autocomplete="new-password" placeholder="Ulangi password"><button type="button" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-slate-800" onclick="toggleEye('pReg2',this)" aria-label="Lihat password"><i class="fa-regular fa-eye"></i></button></div></div>
    <p id="loginMsg" class="text-sm text-red-600 min-h-[1.25rem] mb-2"></p>
    <button id="btnMasuk" class="btn w-full hidden" onclick="masuk()">Masuk</button>
  </div>
  </div>
  <footer class="text-center text-xs text-slate-500 pt-4">Powered by Anto Design Concept &copy; 2026</footer>
</section>

  <footer class="text-center text-xs text-slate-500 py-6">Powered by Anto Design Concept &copy; 2026</footer>
</section>

<!-- D. USER -->
<section id="v-user" class="hidden min-h-screen flex flex-col">
  <div class="js-header"></div>
  <main class="w-full max-w-3xl mx-auto flex-1 p-4 space-y-5">
    <div class="bg-white rounded-2xl shadow p-4">
      <div class="flex items-center gap-2">
        <button type="button" data-toggle="bodyDiri" class="flex-1 text-left font-bold" onclick="toggleSeksi('bodyDiri',this)" aria-expanded="false"><i class="fa-solid fa-id-card text-blue-700 mr-2"></i>Data Diri</button>
        <button class="text-sm text-blue-700 font-semibold" onclick="ubahDiri()">Ubah</button>
        <button type="button" data-toggle="bodyDiri" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-500" onclick="toggleSeksi('bodyDiri',this)" aria-expanded="false" aria-label="Ciutkan atau buka Data Diri"><i data-chev="bodyDiri" class="fa-solid fa-chevron-up transition-transform" style="transform:rotate(180deg)"></i></button>

      <div id="bodyJumlah" class="hidden mt-3">

      <button class="btn w-full" onclick="formData()">Tambah data konstituen</button>
      <div class="relative mt-3">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input id="cariData" class="inp pl-9" placeholder="Cari data (nama, NIK, kelurahan, hubungan)" oninput="renderUser()"></div>
      <div id="wrapData" class="tbl-wrap mt-3"><table class="tbl tbl-t whitespace-nowrap">
        <tbody id="dataBody"></tbody></table></div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/50 items-center justify-center p-4"></div>
<div id="confirm" class="hidden fixed inset-0 z-[60] bg-black/60 items-center justify-center p-4"></div>

<script>
/* ================== KONFIGURASI ================== */
const SUPABASE_URL      = 'https://xnxodvsycgtsgvofofyh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8SOrlhZ__osfT14ZKPmJtg_vy20APAW';
const LOGO_URL          = 'https://res.cloudinary.com/q7sznixw/image/upload/v1791355406/Logo_SIDAK_Data_Konstituen_i9hub5.webp';
const HEADER_IMG_URL    = 'https://res.cloudinary.com/q7sznixw/image/upload/v1788749592/6_vbabok.png';
/* ================================================= */
  
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
let S = JSON.parse(sessionStorage.getItem('sidak') || 'null');
let ADATA = [], UDATA = [], PROFIL = null;

document.querySelectorAll('.js-logo').forEach(i => i.src = LOGO_URL);

/* ---------- Header + jam ---------- */
function headerHTML() {
  return `<header class="hdr relative overflow-hidden text-white">
    <img src="${HEADER_IMG_URL}" alt="" class="absolute right-0 top-0 h-full w-auto max-w-[55%] object-contain object-right opacity-90 pointer-events-none"
         style="-webkit-mask-image:linear-gradient(to left,#000 40%,transparent);mask-image:linear-gradient(to left,#000 40%,transparent)">
    <div class="relative max-w-5xl mx-auto px-4 py-4 flex flex-col items-start text-left gap-1">
      <span class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/60 backdrop-blur-sm shadow-md p-0.5"><img src="${LOGO_URL}" alt="SIDAK" class="max-w-full max-h-full object-contain"></span>
      <p class="font-bold text-sm sm:text-base leading-tight">Sistem Informasi Data Konstituen</p>
      <p class="js-date text-xs sm:text-sm text-blue-100"></p>
      <p class="js-time text-xl sm:text-2xl font-extrabold tabular-nums"></p>
      <button onclick="keluar()" class="mt-1 text-sm text-white bg-red-600/75 hover:bg-red-600/90 rounded-full px-4 py-1.5 font-semibold"><i class="fa-solid fa-right-from-bracket mr-1"></i>Keluar</button>
    </div></header>`;
}
document.querySelectorAll('.js-header').forEach(h => h.innerHTML = headerHTML());
function tick() {
  const n = new Date();
  const d = n.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const t = n.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).replace(/\./g, ':');
  document.querySelectorAll('.js-date').forEach(e => e.textContent = d);
  document.querySelectorAll('.js-time').forEach(e => e.textContent = t);
}
tick(); setInterval(tick, 1000);

/* ---------- Navigasi ---------- */
function show(v) { ['login','admin','user'].forEach(x => $('v-'+x).classList.toggle('hidden', x !== v)); }
function start(sess) {
  S = sess; sessionStorage.setItem('sidak', JSON.stringify(S));
  if (S.role === 'admin') { show('admin'); loadAdmin(); subscribeAdmin(); } else { show('user'); loadUser(); subscribeUser(); }
}
function keluar() { sessionStorage.removeItem('sidak'); S = null; location.reload(); }

/* ---------- Splash ---------- */
setTimeout(() => {
  if (S) { start(S); } else { show('login'); }
  $('splash').style.transform = 'translateX(-100%)';
  setTimeout(() => $('splash').remove(), 800);
}, 2600);

/* ---------- Login ---------- */
let step = '';
const msg = t => $('loginMsg').textContent = t;
function setRole() {
  ['admin','hp','pass','reg'].forEach(b => $('blk-'+b).classList.add('hidden'));
  const r = (document.querySelector('input[name="role"]:checked') || {}).value || ''; msg('');
  step = r === 'admin' ? 'admin' : r === 'user' ? 'hp' : '';
  if (r === 'admin') $('blk-admin').classList.remove('hidden');
  if (r === 'user') $('blk-hp').classList.remove('hidden');
  $('hp').disabled = false;
  $('btnMasuk').classList.toggle('hidden', !step);
  $('btnMasuk').textContent = step === 'hp' ? 'Lanjut' : 'Masuk';
}
async function masuk() {
  msg(''); const b = $('btnMasuk'); b.disabled = true;
  try {
    if (step === 'admin') {
      const p = $('pAdmin').value;
      (await rpc('login_admin', { p_pass: p })) ? start({ role:'admin', pass:p }) : msg('Password salah.');
    } else if (step === 'hp') {
      const hp = $('hp').value.trim();
      const r = await rpc('cek_login_user', { p_hp: hp });
      if (r === 'ditolak') return msg('Nomor tidak terdaftar. Hubungi admin untuk didaftarkan.');
      $('hp').disabled = true;
      step = r === 'password' ? 'pass' : 'reg';
      $('blk-' + step).classList.remove('hidden');
      b.textContent = step === 'pass' ? 'Masuk' : 'Simpan & Masuk';
    } else if (step === 'pass') {
      const hp = $('hp').value.trim(), p = $('pUser').value;
      (await rpc('login_user', { p_hp: hp, p_pass: p })) ? start({ role:'user', hp, pass:p }) : msg('Password salah.');
    } else if (step === 'reg') {
      const hp = $('hp').value.trim(), p = $('pReg1').value;
      if (p.length < 6) return msg('Password minimal 6 karakter.');
      if (p !== $('pReg2').value) return msg('Password tidak sama.');
      (await rpc('registrasi_user', { p_hp: hp, p_pass: p })) ? start({ role:'user', hp, pass:p }) : msg('Registrasi gagal. Coba masuk ulang.');
    }
  } catch (e) { msg('Terjadi kesalahan: ' + e.message); }
  finally { b.disabled = false; }
}

/* ---------- Modal formulir ---------- */
const FIELDS = {
  nama:['Nama','text'], nik:['NIK (16 digit)','nik'], jenis_kelamin:['Jenis kelamin','jk'],
  no_hp:['No. HP','hp'], alamat:['Alamat','area'], kelurahan:['Kelurahan','kel'],
  kecamatan:['Kecamatan','kec'], no_tps:['No. TPS (opsional)','num'], hubungan:['Hubungan dengan Pendata','hub'],
  pend_hp:['No. telepon pendata','hp'], pend_nama:['Nama pendata (opsional)','text']
};
const OPTIONAL = ['no_hp','no_tps','pend_nama'];
const WILAYAH = {
  'Kadia': ['Anaiwoi','Bende','Kadia','Pondambea','Wowawanggu'],
  'Wua Wua': ['Anawai','Bonggoeya','Mataiwoi','Wua Wua']
};
function angka(el) { el.value = el.value.replace(/\D/g, ''); }
// Kecamatan -> Kelurahan (tampil bila kecamatan terisi) -> TPS (tampil bila kelurahan terisi)
function pasangWilayah(f, vals) {
  if (!f.elements['kecamatan'] || !f.elements['kelurahan']) return;
  const kecEl = f.elements['kecamatan'], kelEl = f.elements['kelurahan'];
  const box = n => f.elements[n] ? f.elements[n].closest('[data-f]') : null;
  const tpsBox = () => {
    const ada = !!kelEl.value, b = box('no_tps');
    if (b) { b.classList.toggle('hidden', !ada); if (!ada) f.elements['no_tps'].value = ''; }
  };
  const isiKel = (pilih) => {
    const daftar = WILAYAH[kecEl.value] || [];
    kelEl.innerHTML = '<option value="">Pilih kelurahan...</option>' + daftar.map(x => `<option>${esc(x)}</option>`).join('');
    if (pilih && daftar.includes(pilih)) kelEl.value = pilih;
    box('kelurahan').classList.toggle('hidden', !kecEl.value);
    kelEl.required = !!kecEl.value;
    tpsBox();
  };
  kecEl.addEventListener('change', () => isiKel(''));
  kelEl.addEventListener('change', tpsBox);
  isiKel(vals.kelurahan);
}
// Potensi dihitung otomatis di database dari hubungan ini
const HUBUNGAN = ['Istri','Anak','Ponakan','Saudara','Keluarga dalam rumah','Keluarga dekat','Teman Akrab',
                  'Tetangga','Keluarga jauh','Kenalan','Warga'];
function openForm({ title, keys, vals = {}, readonly = [], closable = true, dua = false, cari = false, catatan = '', onSave }) {
  const m = $('modal');
  m.innerHTML = `<form class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 space-y-3">
    <div class="flex justify-between items-center"><h3 class="font-bold text-lg">${esc(title)}</h3>

        box.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1"></i>NIK tidak ditemukan di data master.';

function navBar(id) {

}
function geser(id, aksi) {
  const w = $(id); if (!w) return;
  const langkah = Math.max(160, w.clientWidth * 0.7);
  const x = aksi === 'awal' ? 0 : aksi === 'akhir' ? w.scrollWidth : aksi === 'kiri' ? w.scrollLeft - langkah : w.scrollLeft + langkah;
  w.scrollTo({ left: x, behavior: 'smooth' });
}
function updNav(id) {
  const w = $(id); if (!w) return;
  const maks = w.scrollWidth - w.clientWidth - 1, x = w.scrollLeft;
  document.querySelectorAll('[data-nav="' + id + '"]').forEach(b => {
    const mundur = b.dataset.aksi === 'awal' || b.dataset.aksi === 'kiri';
    b.disabled = maks <= 0 || (mundur ? x <= 0 : x >= maks);
  });
}
function pasangNav(id) { const w = $(id); if (w) { w.addEventListener('scroll', () => updNav(id)); updNav(id); } }

function dialog({ judul, pesan, tombol, tipe, batal }) {

    const w = DLG[tipe], c = $('confirm');

        <button id="cy" class="flex-1 rounded-lg py-2.5 font-semibold text-white ${w[2]}">${esc(tombol)}</button></div></div>`;
    c.classList.remove('hidden'); c.classList.add('flex');

/* ---------- ADMIN ---------- */
const CARDS = [
  ['masuk','Data Masuk','fa-inbox','from-blue-600 to-blue-400'],
  ['ganda','Data Ganda','fa-clone','from-red-600 to-red-400'],
  ['bersih','Data Bersih','fa-circle-check','from-teal-600 to-teal-400'],
  ['tinggi','Potensi Tinggi','fa-arrow-trend-up','from-green-700 to-green-500'],
  ['sedang','Potensi Sedang','fa-minus','from-amber-600 to-amber-400'],
  ['rendah','Potensi Rendah','fa-arrow-trend-down','from-slate-600 to-slate-400']
];
// Prioritas data ganda per NIK: data diri pendata > potensi (Tinggi > Sedang > Rendah) > yang lebih dulu masuk.
// Yang pertama = prioritas (oranye, dipertahankan); sisanya = duplikat (merah).
const RANK = { Tinggi: 3, Sedang: 2, Rendah: 1 };
function hitungPrioritas() {
  const grup = {};
  ADATA.forEach(d => { d.prioritas = false; d.merah = false; d.unggul = false; if (d.ganda) (grup[d.nik] = grup[d.nik] || []).push(d); });
  Object.values(grup).forEach(a => {
    const atas = Math.max(...a.map(d => RANK[d.potensi] || 0));
    const teratas = a.filter(d => (RANK[d.potensi] || 0) === atas);
    if (teratas.length === 1) teratas[0].unggul = true;   // satu-satunya yang tertinggi -> tombol oranye
    a.sort((x, y) => ((y.is_diri ? 1 : 0) - (x.is_diri ? 1 : 0))
      || ((RANK[y.potensi] || 0) - (RANK[x.potensi] || 0))
      || (new Date(x.created_at) - new Date(y.created_at)));
    a[0].prioritas = true; a.slice(1).forEach(d => d.merah = true);
  });
}
// Kartu mengikuti filter di seksi Cetak Data. Data Bersih = jumlah NIK unik (data ganda merah tidak dihitung).
function renderCards(rows) {
  const n = { masuk: rows.length, ganda: rows.filter(d => d.ganda).length, bersih: rows.filter(d => !d.merah).length,
    tinggi: rows.filter(d => d.potensi === 'Tinggi').length, sedang: rows.filter(d => d.potensi === 'Sedang').length,
    rendah: rows.filter(d => d.potensi === 'Rendah').length };
  $('cards').innerHTML = CARDS.map(([k, lb, ic, g]) => {
    const pct = n.masuk ? (n[k] / n.masuk * 100).toFixed(1) : '0.0';
    return `<div class="col-span-2 md:col-span-1 bg-gradient-to-br ${g} text-white rounded-2xl p-3 md:p-4 shadow">
      <i class="fa-solid ${ic} text-xl md:text-2xl opacity-80"></i>
      <p class="text-2xl md:text-3xl font-extrabold mt-1 md:mt-2">${n[k]}</p>
      <p class="text-xs md:text-sm font-semibold leading-tight">${lb}</p><p class="text-xs opacity-90">${pct}%</p></div>`;
  }).join('');
}

function fillVal() {
  const by = $('by').value, sel = $('val'), tps = by === 'tps';

  if (!by) { sel.innerHTML = '<option value="">-</option>'; sel.disabled = true; infoCetak(); return; }
  sel.disabled = false;

const uniq = a => [...new Set(a.filter(Boolean))].sort((x, y) => String(x).localeCompare(String(y), 'id', { numeric: true }));
// Pilihan bertingkat: Kecamatan -> Kelurahan -> TPS (nomor TPS bisa sama di kelurahan berbeda)
function fillWil(dari) {
  const opt = (arr, semua) => `<option value="">${semua}</option>` + arr.map(v => `<option>${esc(v)}</option>`).join('');
  const isi = (el, html) => { const c = el.value; el.innerHTML = html; if ([...el.options].some(o => o.value === c)) el.value = c; };
  if (dari === 'kec') isi($('wKec'), opt(uniq(ADATA.map(d => d.kecamatan)), 'Semua kecamatan'));
  const kec = $('wKec').value;
  if (dari === 'kec' || dari === 'kel') {
    isi($('wKel'), opt(uniq(ADATA.filter(d => !kec || d.kecamatan === kec).map(d => d.kelurahan)), 'Semua kelurahan'));
  }
  if (dari !== 'tps') {
    const kel = $('wKel').value;
    isi($('wTps'), opt(uniq(ADATA.filter(d => (!kec || d.kecamatan === kec) && (!kel || d.kelurahan === kel)).map(d => d.no_tps)), 'Semua TPS'));
  }
  infoCetak();
}
function dataCetak() {
  const by = $('by').value;
  if (by === 'ganda') return { rows: ADATA.filter(d => d.ganda), judul: 'Data Ganda' };
  if (by === 'tps') {
    const kec = $('wKec').value, kel = $('wKel').value, tps = $('wTps').value;
    const rows = ADATA.filter(d => (!kec || d.kecamatan === kec) && (!kel || d.kelurahan === kel) && (!tps || d.no_tps === tps));
    const bag = [kec && 'Kec. ' + kec, kel && 'Kel. ' + kel, tps && 'TPS ' + tps].filter(Boolean);
    return { rows, judul: bag.length ? bag.join(' / ') : 'Semua Wilayah' };
  }
  if (by) { const v = $('val').value; return { rows: ADATA.filter(d => d[by] === v), judul: $('by').selectedOptions[0].text + ': ' + v }; }
  return { rows: ADATA, judul: 'Semua Data' };
}

async function loadPendata() {

function renderPendata() {
  const q = ($('cariPendata').value || '').toLowerCase().trim();
  const list = PEND.filter(p => !q || (p.nama || '').toLowerCase().includes(q) || (p.no_hp || '').includes(q));
  // Data / Ganda / Bersih per pendata (tidak termasuk data diri pendata)
  const st = {}, kosong = { data: 0, ganda: 0, bersih: 0 };
  ADATA.forEach(d => {
    if (d.is_diri) return;
    const a = st[d.pendata_id] = st[d.pendata_id] || { data: 0, ganda: 0, bersih: 0 };
    a.data++; if (d.ganda) a.ganda++; if (!d.merah) a.bersih++;
  });
  const stat = p => st[p.id] || kosong;
  // Judul di kolom kiri, setiap pendata satu kolom ke kanan
  const baris = [
    ['No', (p, i) => i + 1],
    ['No. HP', p => `<a href="${waLink(p.no_hp)}" target="_blank" rel="noopener" class="text-green-700 font-semibold hover:underline" title="Chat WhatsApp"><i class="fa-brands fa-whatsapp mr-1"></i>${esc(p.no_hp)}</a>`],
    ['Nama', p => esc(p.nama || '-')],

      : '<span class="rounded-full bg-amber-100 text-amber-700 text-xs font-semibold px-2.5 py-1">Belum registrasi</span>'],
    ['Data', p => stat(p).data],
    ['Ganda', p => `<span class="${stat(p).ganda ? 'text-red-600 font-bold' : ''}">${stat(p).ganda}</span>`],
    ['Bersih', p => `<span class="text-green-700 font-semibold">${stat(p).bersih}</span>`],
    ['Aksi', p => `<div class="flex flex-col gap-1.5">
      <button class="ba ba-g" onclick="lihatPendata('${p.id}')">Lihat Data</button>
      <button class="ba ba-y" onclick="resetPw('${p.id}')">Reset Password</button>
      <button class="ba ba-r" onclick="hapusPendata('${p.id}')">Hapus Pendata</button></div>`]
  ];
  $('pendataBody').innerHTML = list.length
    ? baris.map(([lb, f]) => `<tr><th>${lb}</th>${list.map((p, i) => `<td>${f(p, i)}</td>`).join('')}</tr>`).join('')

}

    pesan: (p.nama || p.no_hp || 'Pendata ini') + ' beserta ' + (p.jumlah || 0) + ' data yang ia input akan dihapus permanen dan tidak bisa dikembalikan.' });
  if (!ok) return;
  try { await rpc('admin_pendata_hapus', { p_pass: S.pass, p_id: id }); await loadAdmin(true); toast('Pendata berhasil dihapus'); }
  catch (e) { notif(e.message, 'Gagal menghapus pendata'); }
}

/* ---------- Lihat Data (admin, mengikuti filter Cetak Data) ---------- */
function lihatAdmin() {
  viewModal('Lihat Data', `<div id="lihatBody"></div>`);
  renderLihat();
}
function renderLihat() {
  const lama = $('wrapLihat'), x0 = lama ? lama.scrollLeft : 0;   // pertahankan posisi geser saat data diperbarui
  const { rows, judul } = dataCetak();
  const urut = [...rows].sort((a, b) => {
    if (a.ganda !== b.ganda) return a.ganda ? -1 : 1;                    // data ganda di depan, dikelompokkan per NIK
    if (a.ganda) return String(a.nik).localeCompare(String(b.nik))
      || ((RANK[b.potensi] || 0) - (RANK[a.potensi] || 0)) || (new Date(a.created_at) - new Date(b.created_at));
    return String(a.nama).localeCompare(String(b.nama), 'id');
  });
  const head = `<p class="text-xs text-slate-500 mb-2">${esc(judul)} &middot; ${rows.length} data &middot; ${rows.filter(d => d.ganda).length} ganda</p>`;
  if (!rows.length) { $('lihatBody').innerHTML = head + '<p class="text-slate-500 text-sm">Tidak ada data pada filter ini.</p>'; return; }
  // Judul di kolom kiri, setiap data satu kolom ke kanan
  const baris = [
    ['Nama', d => `<span class="font-semibold">${esc(d.nama)}</span>`],
    ['NIK', d => esc(d.nik)],
    ['Hubungan', d => esc(d.hubungan || (d.is_diri ? 'Data diri' : '-'))],
    ['Potensi', d => `<span class="rounded-full text-xs font-semibold px-2.5 py-1 ${POTC[d.potensi] || ''}">${esc(d.potensi)}</span>`],
    ['Pendata', d => esc(d.pendata_nama || '')],
    ['Kecamatan', d => esc(d.kecamatan)],
    ['Kelurahan', d => esc(d.kelurahan)],
    ['TPS', d => esc(d.no_tps || '-')],
    ['Ket.', d => d.ganda ? '<span class="rounded-full bg-red-100 text-red-700 text-xs font-semibold px-2.5 py-1">Ganda</span>' : ''],
    ['Aksi', d => d.ganda && !d.is_diri
      ? `<button class="ba ${d.unggul ? 'ba-o' : 'ba-r'}" onclick="hapusGanda('${d.id}')">Hapus</button>`
      : '<span class="text-slate-400">-</span>']
  ];
  $('lihatBody').innerHTML = head + `<div id="wrapLihat" class="tbl-wrap"><table class="tbl tbl-t whitespace-nowrap"><tbody>
    ${baris.map(([lb, f]) => `<tr><th>${lb}</th>${urut.map((d, i) => `<td>${f(d, i)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="mt-2">${navBar('wrapLihat')}</div>`;
  pasangNav('wrapLihat'); $('wrapLihat').scrollLeft = x0;
}
async function hapusGanda(id) {
  const d = ADATA.find(x => x.id === id); if (!d) return;
  const ok = await konfirmasi({ judul: 'Hapus data ganda?', tipe: 'bahaya', tombol: 'Ya, hapus',
    pesan: 'Data "' + d.nama + '" (NIK ' + d.nik + ') dari ' + (d.pendata_nama || 'pendata') + ' akan dihapus permanen dan tidak bisa dikembalikan.'
      + (d.unggul ? ' Perhatian: data ini memiliki prioritas lebih baik dari data ganda lainnya, hapus hanya bila memang keliru.' : '') });
  if (!ok) return;
  try { await rpc('admin_data_hapus', { p_pass: S.pass, p_id: id }); await loadAdmin(true); toast('Data berhasil dihapus'); }
  catch (e) { notif(e.message, 'Gagal menghapus data'); }
}

/* ---------- Sinkronisasi seketika (admin) ---------- */
let PEND = [], adminCh = null;
function subscribeAdmin() {
  if (adminCh) return;
  let t;
  const segarkan = () => { clearTimeout(t); t = setTimeout(() => loadAdmin(true), 400); };
  adminCh = sb.channel('sidak-admin').on('broadcast', { event: 'berubah' }, segarkan).subscribe();
  setInterval(() => loadAdmin(true), 20000);   // cadangan bila koneksi realtime terputus
}

/* ---------- Sinkronisasi seketika (user) ---------- */
// Admin menghapus/mengubah data -> sinyal "berubah" -> data, tanda ganda, dan jumlah di halaman user dimuat ulang
let userCh = null;
function subscribeUser() {
  if (userCh) return;
  let t;
  const segarkan = () => { clearTimeout(t); t = setTimeout(() => loadUser(true), 400); };
  userCh = sb.channel('sidak-admin').on('broadcast', { event: 'berubah' }, segarkan).subscribe();
  setInterval(() => { if (!document.hidden) loadUser(true); }, 15000);          // cadangan bila koneksi realtime terputus
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadUser(true); });   // segarkan saat kembali ke aplikasi
}

/* ---------- Modal tabel (Lihat) ---------- */
function viewModal(title, inner, actions = '') {
  const m = $('modal');
  m.innerHTML = `<div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col">
    <div class="flex justify-between items-center p-4 border-b"><h3 class="font-bold">${esc(title)}</h3>
      <button id="mx" class="text-slate-500 text-xl">&times;</button></div>
    <div class="p-4 overflow-auto">${inner}</div>
    <div class="p-4 border-t flex gap-2 justify-end">${actions}<button class="btn bg-slate-500 hover:bg-slate-600" onclick="closeForm()">Tutup</button></div></div>`;
  m.classList.remove('hidden'); m.classList.add('flex');
  $('mx').onclick = closeForm;
}
function tabelData(rows, aksi) {
  if (!rows.length) return '<p class="text-slate-500 text-sm">Belum ada data.</p>';
  return `<div class="tbl-wrap"><table class="tbl whitespace-nowrap"><thead><tr>
    <th>No</th><th>Nama</th><th>NIK</th><th>JK</th><th>Hubungan</th><th>Potensi</th><th>Kelurahan</th><th>Kecamatan</th><th>TPS</th><th>Ket.</th>${aksi ? '<th>Aksi</th>' : ''}</tr></thead><tbody>
    ${rows.map((d, i) => `<tr><td>${i + 1}</td><td class="font-semibold">${esc(d.nama)}</td><td>${esc(d.nik)}</td>
      <td>${d.jenis_kelamin || ''}</td><td>${esc(d.hubungan || (d.is_diri ? 'Data diri' : '-'))}</td>
      <td><span class="rounded-full text-xs font-semibold px-2.5 py-1 ${POTC[d.potensi] || ''}">${esc(d.potensi)}</span></td>
      <td>${esc(d.kelurahan)}</td><td>${esc(d.kecamatan)}</td><td>${esc(d.no_tps || '')}</td>
      <td>${d.ganda ? '<span class="rounded-full bg-red-100 text-red-600 text-xs font-semibold px-2.5 py-1">Ganda</span>' : ''}</td>
      ${aksi ? `<td>${d.is_diri ? '<span class="text-slate-400">-</span>' : `<button class="ba ba-r" onclick="hapusData('${d.id}','${d.pendata_id}')">Hapus</button>`}</td>` : ''}</tr>`).join('')}
    </tbody></table></div>`;
}
function lihatPendata(id) {
  const p = PEND.find(x => x.id === id) || {}, rows = ADATA.filter(d => d.pendata_id === id);
  viewModal('Data dari ' + (p.nama || p.no_hp || 'pendata') + ' (' + rows.length + ')', tabelData(rows, true),
    `<button class="btn btn-b" onclick="cetakPendata('${id}')"><i class="fa-solid fa-print mr-1"></i>Cetak</button>`);
}
async function hapusData(id, pendataId) {
  const d = ADATA.find(x => x.id === id);
  const ok = await konfirmasi({ judul: 'Hapus data?', tipe: 'bahaya', tombol: 'Ya, hapus',
    pesan: 'Data "' + (d ? d.nama : '') + '" akan dihapus permanen dan tidak bisa dikembalikan.' });
  if (!ok) return;
  try {
    await rpc('admin_data_hapus', { p_pass: S.pass, p_id: id });
    await loadAdmin(true);
    lihatPendata(pendataId);   // tampilkan ulang daftar yang sudah diperbarui
    toast('Data berhasil dihapus');
  } catch (e) { notif(e.message, 'Gagal menghapus data'); }
}
function cetakPendata(id) {
  const p = PEND.find(x => x.id === id) || {};
  printRows('Laporan Data Konstituen - Pendata: ' + (p.nama || p.no_hp || ''), ADATA.filter(d => d.pendata_id === id), true);
}

/* ---------- USER ---------- */
const ua = () => ({ p_hp: S.hp, p_pass: S.pass });
async function loadUser(silent) {
  try {
    PROFIL = await rpc('user_profil', ua());
    const p = PROFIL, jk = p.jenis_kelamin === 'L' ? 'Laki-laki' : p.jenis_kelamin === 'P' ? 'Perempuan' : '-';
    $('diri').innerHTML = [['Nama',p.nama],['NIK',p.nik],['Jenis kelamin',jk],['No. HP',p.no_hp],['Alamat',p.alamat],
      ['Kelurahan',p.kelurahan],['Kecamatan',p.kecamatan],['No. TPS',p.no_tps]]
      .map(([k, v]) => `<dt class="text-slate-500">${k}</dt><dd class="col-span-2 font-semibold">${esc(v || '-')}</dd>`).join('');
    if (!p.nik && $('modal').classList.contains('hidden')) ubahDiri(false);
    const s = await rpc('user_ringkasan', ua());
    $('sum').innerHTML = [['Laki-laki',s.laki,'fa-mars','text-blue-700'],['Perempuan',s.perempuan,'fa-venus','text-pink-600'],['Data ganda',s.ganda,'fa-clone','text-red-600']]
      .map(([k, n, ic, c]) => `<div class="rounded-xl bg-slate-50 p-3"><i class="fa-solid ${ic} ${c} text-xl"></i><p class="text-2xl font-extrabold">${n}</p><p class="text-xs text-slate-500">${k}</p></div>`).join('');
    UDATA = await rpc('user_data', ua());
    renderUser();
  } catch (e) {
    // Pembaruan otomatis: gangguan jaringan diabaikan; hanya sesi yang benar-benar ditolak server yang keluar
    if (silent && !String(e.message || '').includes('Akses ditolak')) return;
    notif('Sesi tidak valid atau sudah berakhir. Silakan masuk kembali.', 'Sesi berakhir').then(keluar);
  }
}
function renderUser() {
  const q = ($('cariData').value || '').toLowerCase().trim();
  const list = UDATA.filter(d => !q || [d.nama, d.nik, d.kelurahan, d.kecamatan, d.hubungan, d.no_tps].some(v => (v || '').toLowerCase().includes(q)));
  // Judul di kolom kiri, setiap data konstituen satu kolom ke kanan
  const baris = [
    ['No', (d, i) => i + 1],
    ['Nama', d => `<span class="font-semibold">${esc(d.nama)}</span>${d.ganda ? ' <span class="ml-1 rounded-full bg-red-100 text-red-600 text-xs font-semibold px-2 py-0.5">Ganda</span>' : ''}`],
    ['NIK', d => esc(d.nik)],
    ['Hubungan', d => esc(d.hubungan || '-')],
    ['Kecamatan', d => esc(d.kecamatan)],
    ['Kelurahan', d => esc(d.kelurahan)],
    ['TPS', d => esc(d.no_tps || '-')],
    ['Aksi', d => `<button class="ba ba-b" onclick="formData(${UDATA.indexOf(d)})">Ubah</button>`]
  ];
  $('dataBody').innerHTML = list.length
    ? baris.map(([lb, f]) => `<tr><th>${lb}</th>${list.map((d, i) => `<td>${f(d, i)}</td>`).join('')}</tr>`).join('')
    : `<tr><td class="text-slate-500">${q ? 'Tidak ada data yang cocok dengan pencarian.' : 'Belum ada data. Tekan tombol di atas untuk mulai mendata.'}</td></tr>`;
}
function ubahDiri(closable = true) {
  openForm({
    title: closable ? 'Ubah Data Diri' : 'Lengkapi Data Diri', closable, cari: true,
    catatan: 'Cukup masukkan NIK Anda. Nama, alamat, kelurahan, kecamatan, dan TPS terisi otomatis dari data master.',
    keys: ['nik'], vals: PROFIL,
    onSave: async o => { await rpc('user_simpan_diri', { ...ua(), p: o }); loadUser(); }
  });
}
function formData(i) {
  const d = i === undefined ? null : UDATA[i];
  openForm({
    title: d ? 'Ubah Data' : 'Tambah Data', vals: d || {}, dua: !d, cari: true,
    catatan: 'Masukkan NIK. Nama, alamat, kelurahan, kecamatan, dan TPS terisi otomatis dari data master.',
    keys: ['nik','no_hp','hubungan'],
    onSave: async o => { await rpc('user_simpan_data', { ...ua(), p_id: d ? d.id : null, p: o }); loadUser(); }
  });
}
function cetakUser() { printRows('Data Pendataan - ' + (PROFIL.nama || PROFIL.no_hp), UDATA, false); }

/* ---------- Cetak ---------- */
function printRows(title, rows, withPendata) {
  const head = ['No','Nama','NIK','JK','No. HP','Alamat','Kelurahan','Kecamatan','TPS','Hubungan','Potensi'].concat(withPendata ? ['Pendata'] : []).concat(['Ket.']);
  const body = rows.map((d, i) => `<tr><td>${i+1}</td><td>${esc(d.nama)}</td><td>${esc(d.nik)}</td><td>${d.jenis_kelamin||''}</td>
    <td>${esc(d.no_hp||'')}</td><td>${esc(d.alamat)}</td><td>${esc(d.kelurahan)}</td><td>${esc(d.kecamatan)}</td>
    <td>${esc(d.no_tps||'')}</td><td>${esc(d.hubungan || (d.is_diri ? 'Data diri' : '-'))}</td><td>${esc(d.potensi)}</td>${withPendata ? `<td>${esc(d.pendata_nama||'')}</td>` : ''}
    <td>${d.ganda ? 'Ganda' : ''}</td></tr>`).join('') || `<tr><td colspan="${head.length}" align="center">Tidak ada data</td></tr>`;
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;width:0;height:0;border:0';
  document.body.appendChild(f);
  f.contentDocument.write(`<html><head><title>${esc(title)}</title><style>
    body{font-family:Arial,sans-serif;font-size:11px} h2{margin:0 0 4px} p{margin:0 0 10px;color:#555}
    table{border-collapse:collapse;width:100%} th,td{border:1px solid #444;padding:4px;text-align:left} th{background:#e5e7eb}
    @page{size:A4 landscape;margin:12mm}</style></head><body>
    <h2>${esc(title)}</h2><p>SIDAK - Dicetak ${new Date().toLocaleString('id-ID')} - Total ${rows.length} data</p>
    <table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></body></html>`);
  f.contentDocument.close();
  f.contentWindow.focus(); f.contentWindow.print();
  setTimeout(() => f.remove(), 2000);
}
</script>
</body>
</html>
